spring.application.name=real-estate-crm
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/real_estate_crm}
spring.datasource.username=${DATABASE_USERNAME:crm}
spring.datasource.password=${DATABASE_PASSWORD:local_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
